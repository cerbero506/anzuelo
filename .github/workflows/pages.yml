# Ejecuta las pruebas y publica el sitio estático en GitHub Pages.
# Requisito único: Settings > Pages > Build and deployment > Source = "GitHub Actions".
name: Pruebas y despliegue en GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  test:
    name: Pruebas del motor
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
      - run: npm test

  deploy:
    name: Publicar sitio
    needs: test
    # En pull requests solo se ejecutan las pruebas; se publica al integrar en main.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Preparar solo los archivos públicos
        run: |
          mkdir _site
          cp -r index.html assets _site/
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v5
